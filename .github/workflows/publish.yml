name: Publish packages

on:
  push:
    branches: [main]
    paths:
      - "src/engine/**"
      - "!src/engine/**/*.test.ts"
      - "src/lib/sharing.ts"
      - "cli/**"
      - "mcp/**"

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Bump versions
        id: version
        run: |
          cd cli
          pnpm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          cd ../mcp
          pnpm version $NEW_VERSION --no-git-tag-version --allow-same-version

      - name: Build CLI
        run: cd cli && pnpm install --frozen-lockfile && pnpm build

      - name: Build MCP
        run: cd mcp && pnpm install --frozen-lockfile && pnpm build

      - name: Publish CLI
        run: cd cli && pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish MCP
        run: cd mcp && pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cli/package.json mcp/package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --tags
